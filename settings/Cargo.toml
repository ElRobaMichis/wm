[package]
name = "wm-settings"
description = "Ventana de ajustes (spike 8): binario aparte para no cargarle Slint a wm.exe."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "wm-settings"
path = "src/main.rs"

[dependencies]
wm-model.workspace = true
# Licencia de Slint: GPL-3.0-only OR royalty-free OR comercial; usamos GPL-3.0.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
] }

[build-dependencies]
slint-build = "=1.18.1"
embed-manifest = "=1.5.1"

[lints]
workspace = true
