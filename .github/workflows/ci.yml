# CI (architecture.md §10 y §13):
# - `build` (spike 0): formato, lint, pruebas, release, y que `wm.exe` no
#   dependa del runtime de C ni importe DLL de gráficos.
# - `ventanas` (spike 9): pruebas con ventanas reales en el escritorio del
#   runner (foco, hook, esconder, marco DWM, overlays, guardián).
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Pruebas
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build de release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Solo DLL del sistema (sin VCRUNTIME ni UCRT)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Select-Object -First 1
          if (-not $dumpbin) { throw "No se encontró dumpbin.exe" }
          # wm.exe (consola) y wmw.exe (sin consola, plan-core.md D5).
          foreach ($name in @("wm.exe", "wmw.exe")) {
            $exe = "target\${{ matrix.target }}\release\$name"
            $deps = & $dumpbin.FullName /dependents $exe | Out-String
            Write-Output "== $name"
            Write-Output $deps
            if ($deps -match '(?i)vcruntime|msvcp|ucrtbase|api-ms-win-crt') {
              throw "$name depende del runtime de C; revisar crt-static (.cargo/config.toml)."
            }
            # Las DLL de gráficos (y shell32/userenv, desde el hito 3) se cargan a
            # demanda (crates/wm-platform/src/dynlib.rs): importarlas en forma
            # estática las cargaría en todos los roles y podría impedir que wm
            # arranque en Windows 10 (architecture.md §13.7).
            if ($deps -match '(?i)d3d11|dxgi|d2d1|dwrite|dcomp|coremessaging|psapi|shell32|userenv') {
              throw "$name importa una DLL de gráficos o del shell en forma estática; usar dynlib."
            }
          }
          $sub = & $dumpbin.FullName /headers "target\${{ matrix.target }}\release\wmw.exe" | Out-String
          if ($sub -notmatch '(?i)Windows GUI') { throw "wmw.exe no es de subsistema Windows GUI." }

      - name: Doctor
        run: target\${{ matrix.target }}\release\wm.exe doctor

  # Va aparte para que un error de formato o de lint no tape estos resultados.
  ventanas:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            required: true
          # Sesión interactiva, pero el proceso no puede tomar el primer plano
          # (actions/runner-images#14049) y a veces arranca en la configuración
          # inicial de Windows (#14677): informa, pero no bloquea.
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            required: false
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 30
    env:
      BIN: target\${{ matrix.target }}\release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p wm -p wm-bench

      - name: Captura al empezar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("ci-artifacts\inicio.png")

      # windows-11-arm arranca a veces con la configuración inicial de Windows
      # ("Choose privacy settings") al frente: tapa los overlays y no deja
      # tomar el primer plano. Si la ventana con foco es una CoreWindow que no
      # es del shell, se informa de qué proceso es y se cierra (la máquina es
      # descartable). En x64 no hace nada.
      - name: Cerrar la configuración inicial si está al frente
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @'
          using System; using System.Runtime.InteropServices; using System.Text;
          public static class Fg {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
          }
          '@
          function Foreground {
            $h = [Fg]::GetForegroundWindow(); $fgPid = 0
            [void][Fg]::GetWindowThreadProcessId($h, [ref]$fgPid)
            $class = New-Object System.Text.StringBuilder 256
            [void][Fg]::GetClassName($h, $class, 256)
            $proc = Get-Process -Id $fgPid -ErrorAction SilentlyContinue
            [pscustomobject]@{ Class = "$class"; Pid = $fgPid; Name = $proc.ProcessName; Path = $proc.Path }
          }
          $fg = Foreground
          Write-Output "Al frente: $($fg.Class) de $($fg.Name) ($($fg.Path))"
          $shell = 'explorer', 'StartMenuExperienceHost', 'ShellExperienceHost', 'SearchHost'
          if ($fg.Class -eq 'Windows.UI.Core.CoreWindow' -and $fg.Name -notin $shell) {
            Stop-Process -Id $fg.Pid -Force
            # Después viene el "primer arranque": una consola de wsl.exe que
            # pide actualizarse y el menú Inicio. Esperar a que el shell se
            # asiente, cerrar la consola y el menú (Esc).
            Start-Sleep -Seconds 15
            Get-Process wsl -ErrorAction SilentlyContinue | Stop-Process -Force
            [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
            Start-Sleep -Seconds 3
            $fg = Foreground
            Write-Output "Cerrado. Ahora al frente: $($fg.Class) de $($fg.Name)"
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("ci-artifacts\despues-de-cerrar.png")
          }

      - name: Sonda (wm ci-probe)
        shell: pwsh
        run: '& "$env:BIN\wm.exe" ci-probe --summary $env:GITHUB_STEP_SUMMARY'

      - name: Guardián - 50 muertes del core (wm crash-test)
        if: success() || failure()
        shell: pwsh
        run: |
          $puppets = Start-Process "$env:BIN\wm.exe" -ArgumentList 'puppet', '10' -PassThru
          Start-Sleep -Seconds 2
          try {
            & "$env:BIN\wm.exe" crash-test cloak 50
            $code = $LASTEXITCODE
          } finally {
            Stop-Process -Id $puppets.Id -Force -ErrorAction SilentlyContinue
          }
          exit $code

      - name: Overlays en pantalla (wm-bench snapshot, Desktop Duplication)
        if: success() || failure()
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:BIN\wm-bench.exe" snapshot
          Move-Item "$env:BIN\overlay-*.bmp" ci-artifacts -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ventanas-${{ matrix.runner }}
          path: ci-artifacts
