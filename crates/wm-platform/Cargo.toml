[package]
name = "wm-platform"
description = "Capa Win32: monitores, DPI, hooks y operaciones sobre ventanas."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    # D3D11, DXGI, D2D, DirectWrite y CoreMessaging: solo interfaces; sus
    # funciones libres se resuelven en tiempo de ejecución (src/dynlib.rs)
    # para que `wm.exe` no las importe en todos sus roles.
    "Graphics",
    "Win32_Devices_Display",
    "Graphics_DirectX",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    # Solo tipos de la bandeja: Shell_NotifyIconW se resuelve con dynlib.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Necesario para declarar interfaces COM no documentadas con `#[interface]`.
windows-core = "=0.62.2"
# Vectores de Windows.UI.Composition.
windows-numerics = "=0.3.1"

[dependencies]
wm-model.workspace = true

[lints]
workspace = true
